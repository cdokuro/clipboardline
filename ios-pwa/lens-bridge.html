<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Google Lens — ClipBoardLine</title>
  <style>
    body{margin:0;height:100vh;display:flex;align-items:center;justify-content:center;background:#14151c;color:#edf0fa;font:500 15px/1.5 -apple-system,BlinkMacSystemFont,system-ui,sans-serif}
    .card{display:flex;flex-direction:column;align-items:center;gap:14px;padding:20px 26px;border-radius:16px;background:#1c1e28;border:1px solid rgba(255,255,255,.09);max-width:300px;text-align:center}
    .spin{width:24px;height:24px;border:3px solid rgba(255,255,255,.18);border-top-color:#7c9cff;border-radius:50%;animation:s .7s linear infinite}
    .hint{font-size:12.5px;color:#97a0ba}
    @keyframes s{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <div class="card">
    <div class="spin"></div>
    <div id="msg">Google Lens'e gönderiliyor…</div>
    <div class="hint" id="hint">Bir saniye içinde arama sonuçları açılacak.</div>
  </div>
  <form id="f" method="POST" action="https://lens.google.com/v3/upload?hl=tr&ep=ccm&re=df" enctype="multipart/form-data" style="display:none">
    <input type="file" name="encoded_image" id="fi">
    <input type="hidden" name="processed_image_dimensions" id="dims" value="">
  </form>
  <script>
    (function () {
      let submitted = false;
      function submitBytes(bytes, dims) {
        if (submitted) return;
        submitted = true;
        try {
          const file = new File([new Uint8Array(bytes)], 'capture.jpg', { type: 'image/jpeg' });
          const dt = new DataTransfer();
          dt.items.add(file);
          document.getElementById('fi').files = dt.files;
          document.getElementById('dims').value = dims || '';
          const f = document.getElementById('f');
          f.action = 'https://lens.google.com/v3/upload?hl=tr&stcs=' + Date.now() + '&ep=ccm&re=df';
          f.submit();
        } catch (err) {
          location.replace('https://lens.google.com/?hl=tr');
        }
      }
      window.addEventListener('message', function (e) {
        if (e.data && e.data.type === 'LENS_IMAGE' && e.data.bytes) {
          submitBytes(e.data.bytes, e.data.dims);
        }
      });
      if (window.opener) {
        window.opener.postMessage({ type: 'LENS_READY' }, '*');
      }
      setTimeout(function () {
        if (!submitted) {
          document.getElementById('msg').textContent = 'Görsel bekleniyor…';
          document.getElementById('hint').textContent = 'Yönlendirilmezse pencereyi kapatıp tekrar deneyin.';
        }
      }, 4000);
    })();
  </script>
</body>
</html>
